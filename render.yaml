# Render Blueprint — optional. You can either:
#   a) click "New +" -> "Blueprint" on Render and point it at this repo, or
#   b) set the backend up manually via the dashboard (see README.md).
#
# This defines the Express API only. Provision the PostgreSQL database
# separately in Render (New + -> PostgreSQL) and either link it below or
# paste its connection string into DATABASE_URL manually.

services:
  - type: web
    name: shetkari-sathi-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # paste your Render Postgres connection string, or link a database below
      - key: CORS_ORIGIN
        sync: false # your Vercel frontend URL(s), comma-separated
      - key: FRONTEND_URL
        sync: false # your Vercel production URL
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: EMAIL_PROVIDER
        value: console
      - key: EMAIL_VERIFICATION_TOKEN_TTL_HOURS
        value: "24"
      - key: EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS
        value: "60"
      - key: PASSWORD_RESET_TOKEN_TTL_MINUTES
        value: "30"

# Uncomment to have Render provision and link a managed Postgres database,
# then reference it above with:
#   - key: DATABASE_URL
#     fromDatabase:
#       name: shetkari-sathi-db
#       property: connectionString
#
# databases:
#   - name: shetkari-sathi-db
#     plan: free
